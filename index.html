<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0821">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>AG — Crystal Quest</title>
<link rel="manifest" id="manifest-placeholder">
<style>
:root {
  --bg-deep: #0b061e;
  --bg-mid: #1a0f3c;
  --accent-pink: #ff2e88;
  --accent-gold: #ffcf56;
  --accent-cyan: #00f0ff;
  --glass: rgba(255, 255, 255, 0.08);
  --glass-border: rgba(255, 255, 255, 0.18);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(circle at 20% 10%, #2d165e 0%, #140a33 50%, #090418 100%);
  font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
  color: #fff;
}
#bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.app {
  position: relative; z-index: 1; width: min(100%, 480px); height: 100dvh;
  margin: 0 auto; padding: env(safe-area-inset-top, 10px) 12px env(safe-area-inset-bottom, 12px);
  display: flex; flex-direction: column; justify-content: space-between;
}
header {
  display: flex; align-items: center; justify-content: space-between; padding: 6px 4px;
}
.brand { display: flex; align-items: center; gap: 8px; }
.logo-badge {
  font-size: 24px; font-weight: 900; letter-spacing: 1px;
  background: linear-gradient(135deg, #fff 10%, #ffcf56 45%, #ff2e88 85%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 8px rgba(255, 46, 136, 0.5));
}
.header-actions { display: flex; gap: 6px; }
.icon-btn {
  background: var(--glass); border: 1px solid var(--glass-border); color: #fff;
  width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
  font-size: 16px; cursor: pointer; backdrop-filter: blur(10px); transition: transform 0.12s;
}
.icon-btn:active { transform: scale(0.9); }

.screen { display: none; flex: 1; flex-direction: column; justify-content: center; gap: 14px; overflow-y: auto; }
.screen.active { display: flex; }

.glass-card {
  background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
  border: 1px solid var(--glass-border); border-radius: 26px; padding: 20px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(16px);
}
.hero { text-align: center; padding: 28px 20px; }
.hero-gems { font-size: 46px; margin-bottom: 10px; filter: drop-shadow(0 8px 16px rgba(0,240,255,0.4)); animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.hero h1 { font-size: 26px; margin: 0 0 8px; background: linear-gradient(90deg, #fff, #ffcf56); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: #cbbbe8; font-size: 14px; margin: 0 0 22px; line-height: 1.5; }

.btn {
  border: 0; border-radius: 18px; padding: 14px 20px; font-weight: 800; font-size: 16px;
  color: #160b2e; background: linear-gradient(135deg, #ffe270 0%, #ff9f1c 100%);
  box-shadow: 0 6px 0 #b86200, 0 12px 24px rgba(255, 159, 28, 0.35);
  cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; width: 100%;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b86200; }
.btn.cyan { background: linear-gradient(135deg, #6ef3ff 0%, #00b4d8 100%); box-shadow: 0 6px 0 #006d85, 0 12px 24px rgba(0, 180, 216, 0.3); color: #051923; }
.btn.cyan:active { box-shadow: 0 2px 0 #006d85; }
.btn.pink { background: linear-gradient(135deg, #ff70a6 0%, #ff0a6c 100%); box-shadow: 0 6px 0 #9e003e, 0 12px 24px rgba(255, 10, 108, 0.35); color: #fff; }
.btn.pink:active { box-shadow: 0 2px 0 #9e003e; }
.btn.sm { padding: 10px 14px; font-size: 13px; border-radius: 14px; }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat-box {
  background: rgba(11, 6, 30, 0.65); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 18px; padding: 10px 6px; text-align: center;
}
.stat-box small { display: block; font-size: 11px; color: #a799c9; margin-bottom: 2px; }
.stat-box b { font-size: 19px; color: var(--accent-gold); font-variant-numeric: tabular-nums; }

/* Game Board */
#game { justify-content: space-between; gap: 8px; padding-bottom: 4px; }
.hud-progress {
  background: rgba(11, 6, 30, 0.6); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 18px; padding: 10px 14px;
}
.hud-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.progress-track { height: 10px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; position: relative; }
.progress-fill {
  height: 100%; width: 0%; border-radius: 99px;
  background: linear-gradient(90deg, #00f0ff, #ffcf56, #ff2e88);
  transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 0 12px rgba(255, 207, 86, 0.7);
}

.board-container {
  position: relative; width: 100%; aspect-ratio: 1;
  background: linear-gradient(145deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
  border: 2px solid rgba(255,255,255,0.22); border-radius: 24px; padding: 8px;
  box-shadow: 0 20px 45px rgba(0,0,0,0.6), inset 0 0 25px rgba(255,255,255,0.08);
  touch-action: none;
}
.board-grid {
  position: relative; width: 100%; height: 100%;
  display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: 4px;
}
.tile-bg {
  background: rgba(10, 5, 28, 0.45); border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.06);
}
#gem-layer, #fx-canvas { position: absolute; inset: 8px; pointer-events: none; }
#fx-canvas { z-index: 10; width: calc(100% - 16px); height: calc(100% - 16px); }

.gem-node {
  position: absolute; width: 12.5%; height: 12.5%; padding: 3px;
  transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s;
  will-change: transform;
}
.gem-node.selected .gem-inner {
  transform: scale(1.16);
  filter: drop-shadow(0 0 12px #fff) brightness(1.2);
}
.gem-inner {
  width: 100%; height: 100%; display: grid; place-items: center;
  transition: transform 0.15s;
}
.gem-inner svg { width: 92%; height: 92%; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.45)); }

/* Special overlays */
.special-striped-h::after, .special-striped-v::after {
  content: ""; position: absolute; inset: 15%; border-radius: 50%;
  border: 2px dashed #fff; animation: spin 4s linear infinite;
}
.special-striped-v::after { border-style: solid; border-color: #00f0ff transparent; }
@keyframes spin { 100% { transform: rotate(360deg); } }

.combo-banner {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
  font-size: 30px; font-weight: 900; color: #fff; text-shadow: 0 4px 16px #ff2e88, 0 0 30px #ffcf56;
  pointer-events: none; z-index: 20; white-space: nowrap;
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
  opacity: 0;
}
.combo-banner.show { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }

.controls-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* Map */
.map-scroll { max-height: 62dvh; overflow-y: auto; padding: 6px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.lvl-node {
  aspect-ratio: 1; border-radius: 18px; border: 1px solid rgba(255,255,255,0.2);
  background: linear-gradient(145deg, #2d1b5e, #180d38); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 5px 0 #0c061f;
}
.lvl-node.current {
  background: linear-gradient(145deg, #ff2e88, #8a1c7c);
  border: 2px solid var(--accent-gold); box-shadow: 0 0 20px rgba(255, 46, 136, 0.6);
  animation: pulse 1.8s infinite;
}
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.lvl-node.locked { opacity: 0.35; filter: grayscale(1); cursor: not-allowed; }
.lvl-stars { font-size: 10px; margin-top: 2px; color: var(--accent-gold); }

/* Modal */
.modal {
  position: fixed; inset: 0; background: rgba(7, 3, 20, 0.85); backdrop-filter: blur(12px);
  display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
}
.modal.open { display: flex; }
.modal-box {
  width: min(100%, 350px); text-align: center;
  background: linear-gradient(160deg, #271454, #12082b);
  border: 1px solid rgba(255,255,255,0.25); border-radius: 28px; padding: 26px 20px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.8);
}
.modal-box h2 { margin: 0 0 10px; font-size: 24px; color: var(--accent-gold); }
.modal-box p { color: #d8ccf2; font-size: 14px; margin: 0 0 20px; line-height: 1.6; }
.modal-actions { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div class="app">
  <header>
    <div class="brand">
      <div class="logo-badge">AG • CRYSTAL</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="installBtn" title="تثبيت كتطبيق" style="display:none">📲</button>
      <button class="icon-btn" id="soundBtn" title="الصوت">🔊</button>
      <button class="icon-btn" id="shareBtn" title="مشاركة">📤</button>
    </div>
  </header>

  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="glass-card hero">
      <div class="hero-gems">💎✨🔮</div>
      <h1>عالم جواهر AG السحري</h1>
      <p>اسحبي الجواهر الكريستالية، فجّري القوى الخارقة، وافتحي 120 مرحلة من التحدي الخيالي!</p>
      <button class="btn" id="playBtn">ابدئي المغامرة ▶</button>
      <div style="height:10px"></div>
      <button class="btn cyan" id="mapOpenBtn">🗺️ خريطة العوالم (120)</button>
    </div>

    <div class="stats-row">
      <div class="stat-box"><small>المرحلة الحالية</small><b id="homeLvl">1</b></div>
      <div class="stat-box"><small>مجموع النجوم</small><b id="homeStars">0 ⭐</b></div>
      <div class="stat-box"><small>أعلى سكور</small><b id="homeBest">0</b></div>
    </div>
  </section>

  <!-- MAP -->
  <section id="map" class="screen">
    <div class="glass-card" style="padding:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <b style="font-size:17px;color:var(--accent-gold)">🗺️ خريطة المراحل</b>
        <button class="btn sm cyan" style="width:auto" id="backHomeBtn">الرئيسية</button>
      </div>
      <div class="map-scroll" id="mapGrid"></div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <div class="stats-row">
      <div class="stat-box"><small>النقاط</small><b id="gScore">0</b></div>
      <div class="stat-box"><small>الحركات</small><b id="gMoves">25</b></div>
      <div class="stat-box"><small>الهدف</small><b id="gGoal">600</b></div>
    </div>

    <div class="hud-progress">
      <div class="hud-top">
        <span id="gLevelLabel" style="color:var(--accent-cyan)">المرحلة 1</span>
        <span id="gRemainLabel" style="color:#e0d4fc">باقي 600</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="gBar"></div></div>
    </div>

    <div class="board-container" id="boardBox">
      <div class="board-grid" id="bgTiles"></div>
      <div id="gem-layer"></div>
      <canvas id="fx-canvas"></canvas>
      <div class="combo-banner" id="comboText">مذهل! ✨</div>
    </div>

    <div class="controls-bar">
      <button class="btn sm cyan" id="shuffleBtn">🔀 خلط (3)</button>
      <button class="btn sm pink" id="restartBtn">↻ إعادة</button>
      <button class="btn sm" id="toMapBtn">🗺️ الخريطة</button>
    </div>
  </section>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div id="modalEmoji" style="font-size:48px;margin-bottom:8px">🏆</div>
    <h2 id="modalTitle">انتصار رائع!</h2>
    <p id="modalDesc">لقد حققتِ الهدف بنجاح.</p>
    <div class="modal-actions">
      <button class="btn" id="modalPrimary">المرحلة التالية</button>
      <button class="btn cyan sm" id="modalShare">مشاركة النتيجة مع أصحابي 📤</button>
    </div>
  </div>
</div>

<script>
// --- PWA Manifest & Service Worker Setup ---
(function setupPWA(){
  const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="44" fill="#140a33"/><polygon points="96,24 160,76 96,168 32,76" fill="#ff2e88"/><polygon points="96,24 132,76 96,168 60,76" fill="#ffcf56" opacity="0.85"/></svg>`;
  const iconUrl = 'data:image/svg+xml;base64,' + btoa(iconSvg);
  const manifest = {
    name: "AG Crystal Quest",
    short_name: "AG Quest",
    start_url: ".",
    display: "standalone",
    background_color: "#090418",
    theme_color: "#140a33",
    icons: [{ src: iconUrl, sizes: "192x192", type: "image/svg+xml" }]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
  document.getElementById('manifest-placeholder').href = URL.createObjectURL(blob);
})();

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'grid';
});
document.getElementById('installBtn').onclick = async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
  }
};

// --- Web Audio Synthesizer (Zero external assets needed) ---
class SoundFX {
  constructor() { this.enabled = true; this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  play(freq, type = 'sine', dur = 0.14, vol = 0.15, slide = 0) {
    if (!this.enabled) return;
    this.init();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    if (slide) osc.frequency.exponentialRampToValueAtTime(slide, this.ctx.currentTime + dur);
    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + dur);
  }
  swap() { this.play(320, 'triangle', 0.1, 0.12, 480); }
  invalid() { this.play(180, 'sawtooth', 0.15, 0.1, 110); }
  match(combo = 1) {
    const base = 440 + Math.min(combo, 6) * 90;
    this.play(base, 'sine', 0.18, 0.18, base * 1.35);
    setTimeout(() => this.play(base * 1.25, 'triangle', 0.2, 0.14), 60);
  }
  special() {
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.play(f, 'sine', 0.22, 0.16), i * 55));
  }
  win() {
    [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => this.play(f, 'triangle', 0.3, 0.2), i * 90));
  }
}
const sfx = new SoundFX();

// --- High-Def SVG Gems ---
const GEM_SVGS = [
  // 0: Ruby Heart/Diamond
  `<svg viewBox="0 0 100 100"><defs><linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff9ebb"/><stop offset="45%" stop-color="#ff1e6e"/><stop offset="100%" stop-color="#8a0034"/></linearGradient></defs><polygon points="50,8 90,38 74,90 26,90 10,38" fill="url(#g0)" stroke="#ffc2d6" stroke-width="3"/><polygon points="50,8 72,38 50,88 28,38" fill="#ffffff" opacity="0.25"/><polygon points="50,14 66,36 34,36" fill="#fff" opacity="0.55"/></svg>`,
  // 1: Sapphire Hexagon
  `<svg viewBox="0 0 100 100"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a8f9ff"/><stop offset="50%" stop-color="#0096ff"/><stop offset="100%" stop-color="#003580"/></linearGradient></defs><polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="url(#g1)" stroke="#ccfaff" stroke-width="3"/><polygon points="50,20 74,35 74,65 50,80 26,65 26,35" fill="#fff" opacity="0.22"/><polygon points="28,28 50,14 68,28" fill="#fff" opacity="0.6"/></svg>`,
  // 2: Sun Topaz Star-Octagon
  `<svg viewBox="0 0 100 100"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff6b3"/><stop offset="50%" stop-color="#ffb703"/><stop offset="100%" stop-color="#b55d00"/></linearGradient></defs><polygon points="32,10 68,10 90,32 90,68 68,90 32,90 10,68 10,32" fill="url(#g2)" stroke="#fff3b0" stroke-width="3"/><circle cx="50" cy="50" r="24" fill="#fff" opacity="0.25"/><polygon points="34,18 66,18 56,36 44,36" fill="#fff" opacity="0.65"/></svg>`,
  // 3: Emerald Cut
  `<svg viewBox="0 0 100 100"><defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#b7ffda"/><stop offset="50%" stop-color="#06d6a0"/><stop offset="100%" stop-color="#025e46"/></linearGradient></defs><rect x="16" y="12" width="68" height="76" rx="18" fill="url(#g3)" stroke="#d8ffec" stroke-width="3"/><rect x="28" y="24" width="44" height="52" rx="10" fill="#fff" opacity="0.22"/><ellipse cx="38" cy="26" rx="14" ry="6" fill="#fff" opacity="0.6"/></svg>`,
  // 4: Amethyst Teardrop/Crystal
  `<svg viewBox="0 0 100 100"><defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f3d5ff"/><stop offset="50%" stop-color="#9d4edd"/><stop offset="100%" stop-color="#3c096c"/></linearGradient></defs><polygon points="50,6 85,50 50,94 15,50" fill="url(#g4)" stroke="#f5dfff" stroke-width="3"/><polygon points="50,6 68,50 50,94 32,50" fill="#fff" opacity="0.25"/><polygon points="50,15 62,42 38,42" fill="#fff" opacity="0.6"/></svg>`,
  // 5: Cosmic Rainbow Orb (Special)
  `<svg viewBox="0 0 100 100"><defs><radialGradient id="g5" cx="35%" cy="35%"><stop offset="0%" stop-color="#ffffff"/><stop offset="30%" stop-color="#ffcf56"/><stop offset="65%" stop-color="#ff2e88"/><stop offset="100%" stop-color="#00f0ff"/></radialGradient></defs><circle cx="50" cy="50" r="42" fill="url(#g5)" stroke="#fff" stroke-width="3"/><circle cx="36" cy="34" r="10" fill="#fff" opacity="0.8"/></svg>`
];

// --- Background Ambient Stars ---
(function initBgStars(){
  const c = document.getElementById('bg-canvas');
  const ctx = c.getContext('2d');
  let w, h, stars = [];
  function resize(){ w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  for(let i=0; i<55; i++) stars.push({x:Math.random()*w, y:Math.random()*h, r:Math.random()*2+0.5, s:Math.random()*0.4+0.1});
  function loop(){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#fff';
    for(let st of stars){
      st.y -= st.s; if(st.y < 0) st.y = h;
      ctx.globalAlpha = 0.3 + Math.sin(Date.now()*0.002 + st.x)*0.3;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();
})();

// --- Particle FX Engine ---
const fxCanvas = document.getElementById('fx-canvas');
const fxCtx = fxCanvas.getContext('2d');
let particles = [];
function spawnBurst(r, c, color) {
  const rect = fxCanvas.getBoundingClientRect();
  fxCanvas.width = rect.width; fxCanvas.height = rect.height;
  const cx = (c + 0.5) * (rect.width / 8);
  const cy = (r + 0.5) * (rect.height / 8);
  for (let i = 0; i < 14; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 5;
    particles.push({ x: cx, y: cy, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, life: 1, color, size: 3 + Math.random()*4 });
  }
}
(function fxLoop(){
  if (particles.length) {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    particles = particles.filter(p => p.life > 0.05);
    for (let p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life *= 0.91;
      fxCtx.globalAlpha = p.life;
      fxCtx.fillStyle = p.color;
      fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); fxCtx.fill();
    }
  }
  requestAnimationFrame(fxLoop);
})();

// --- Game State & Logic ---
const N = 8;
const COLORS = ['#ff1e6e', '#0096ff', '#ffb703', '#06d6a0', '#9d4edd', '#ffffff'];
let grid = []; // { type: 0..4, special: null | 'row' | 'col' | 'bomb', id: number }
let nextId = 1;
let score = 0, moves = 25, level = 1, goal = 600, shufflesLeft = 3;
let unlocked = 1, totalStars = 0, bestScore = 0, levelStars = {};
let busy = false, selected = null;

function loadProgress() {
  try {
    const d = JSON.parse(localStorage.getItem('agCrystalSave_v2') || '{}');
    unlocked = Math.max(1, d.unlocked || 1);
    totalStars = d.totalStars || 0;
    bestScore = d.bestScore || 0;
    levelStars = d.levelStars || {};
  } catch(e) {}
  updateHomeStats();
}
function saveProgress() {
  localStorage.setItem('agCrystalSave_v2', JSON.stringify({ unlocked, totalStars, bestScore, levelStars }));
  updateHomeStats();
}
function updateHomeStats() {
  document.getElementById('homeLvl').textContent = unlocked;
  document.getElementById('homeStars').textContent = totalStars + ' ⭐';
  document.getElementById('homeBest').textContent = bestScore;
}

// Build static background tiles once
const bgTiles = document.getElementById('bgTiles');
for (let i = 0; i < N * N; i++) {
  const d = document.createElement('div'); d.className = 'tile-bg'; bgTiles.appendChild(d);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function randType() { return Math.floor(Math.random() * 5); }

function initGrid() {
  grid = Array.from({length: N}, () => Array(N).fill(null));
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      let t;
      do { t = randType(); }
      while ((c >= 2 && grid[r][c-1].type === t && grid[r][c-2].type === t) ||
             (r >= 2 && grid[r-1][c].type === t && grid[r-2][c].type === t));
      grid[r][c] = { type: t, special: null, id: nextId++ };
    }
  }
  renderGems();
}

function renderGems() {
  const layer = document.getElementById('gem-layer');
  const activeIds = new Set();

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const cell = grid[r][c];
      if (!cell) continue;
      activeIds.add(String(cell.id));
      let el = document.getElementById('gem-' + cell.id);
      if (!el) {
        el = document.createElement('div');
        el.id = 'gem-' + cell.id;
        el.className = 'gem-node';
        el.innerHTML = `<div class="gem-inner">${GEM_SVGS[cell.special === 'bomb' ? 5 : cell.type]}</div>`;
        el.style.transform = `translate(${c * 100}%, ${(r - 2) * 100}%)`;
        layer.appendChild(el);
        requestAnimationFrame(() => {
          el.style.transform = `translate(${c * 100}%, ${r * 100}%)`;
        });
      } else {
        el.style.transform = `translate(${c * 100}%, ${r * 100}%)`;
      }
      el.classList.toggle('selected', selected && selected.r === r && selected.c === c);
      const inner = el.firstElementChild;
      inner.className = 'gem-inner' + (cell.special === 'row' ? ' special-striped-h' : cell.special === 'col' ? ' special-striped-v' : '');
    }
  }

  Array.from(layer.children).forEach(child => {
    if (!activeIds.has(child.id.replace('gem-', ''))) child.remove();
  });
}

// --- Smooth Swipe & Tap Input ---
const boardBox = document.getElementById('boardBox');
let touchStart = null;

function getCellFromEvent(e) {
  const rect = boardBox.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const c = Math.floor(((clientX - rect.left - 8) / (rect.width - 16)) * N);
  const r = Math.floor(((clientY - rect.top - 8) / (rect.height - 16)) * N);
  if (r >= 0 && r < N && c >= 0 && c < N) return { r, c, x: clientX, y: clientY };
  return null;
}

boardBox.addEventListener('pointerdown', (e) => {
  if (busy) return;
  const cell = getCellFromEvent(e);
  if (!cell) return;
  touchStart = cell;
  if (!selected) {
    selected = { r: cell.r, c: cell.c };
    renderGems();
  } else if (selected.r === cell.r && selected.c === cell.c) {
    selected = null;
    renderGems();
  } else if (Math.abs(selected.r - cell.r) + Math.abs(selected.c - cell.c) === 1) {
    const a = selected; selected = null;
    trySwap(a.r, a.c, cell.r, cell.c);
  } else {
    selected = { r: cell.r, c: cell.c };
    renderGems();
  }
});

boardBox.addEventListener('pointermove', (e) => {
  if (busy || !touchStart) return;
  const dx = e.clientX - touchStart.x;
  const dy = e.clientY - touchStart.y;
  if (Math.hypot(dx, dy) > 24) {
    let tr = touchStart.r, tc = touchStart.c;
    if (Math.abs(dx) > Math.abs(dy)) tc += dx > 0 ? 1 : -1;
    else tr += dy > 0 ? 1 : -1;
    const sr = touchStart.r, sc = touchStart.c;
    touchStart = null; selected = null;
    if (tr >= 0 && tr < N && tc >= 0 && tc < N) trySwap(sr, sc, tr, tc);
  }
});
window.addEventListener('pointerup', () => { touchStart = null; });

const wait = ms => new Promise(res => setTimeout(res, ms));

async function trySwap(r1, c1, r2, c2) {
  busy = true;
  sfx.swap();
  [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
  renderGems();
  await wait(220);

  // Rainbow Bomb interaction
  const g1 = grid[r1][c1], g2 = grid[r2][c2];
  if (g1.special === 'bomb' || g2.special === 'bomb') {
    moves--; updateHUD();
    const targetType = g1.special === 'bomb' ? g2.type : g1.type;
    const toClear = new Set([`${r1},${c1}`, `${r2},${c2}`]);
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++)
        if (grid[r][c].type === targetType) toClear.add(`${r},${c}`);
    sfx.special();
    showCombo('قوة قوس قزح! 🌈');
    await clearCells(toClear, 1);
    await cascadeAndResolve(2);
    finishTurn();
    return;
  }

  const matches = findMatchGroups();
  if (!matches.length) {
    sfx.invalid();
    [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
    renderGems();
    await wait(200);
    busy = false;
    return;
  }

  moves--;
  updateHUD();
  await resolveMatches(matches, 1, { r: r2, c: c2 });
  await cascadeAndResolve(2);
  finishTurn();
}

function findMatchGroups() {
  const groups = [];
  // Horizontal
  for (let r = 0; r < N; r++) {
    let c = 0;
    while (c < N) {
      let end = c + 1;
      while (end < N && grid[r][end] && grid[r][c] && grid[r][end].type === grid[r][c].type && grid[r][c].special !== 'bomb') end++;
      if (end - c >= 3) {
        const cells = [];
        for (let k = c; k < end; k++) cells.push({ r, c: k });
        groups.push({ cells, dir: 'h' });
      }
      c = end;
    }
  }
  // Vertical
  for (let c = 0; c < N; c++) {
    let r = 0;
    while (r < N) {
      let end = r + 1;
      while (end < N && grid[end][c] && grid[r][c] && grid[end][c].type === grid[r][c].type && grid[r][c].special !== 'bomb') end++;
      if (end - r >= 3) {
        const cells = [];
        for (let k = r; k < end; k++) cells.push({ r: k, c });
        groups.push({ cells, dir: 'v' });
      }
      r = end;
    }
  }
  return groups;
}

async function resolveMatches(groups, combo, focusPos = null) {
  const toClear = new Set();
  const specialsToSpawn = [];

  for (const g of groups) {
    g.cells.forEach(pt => toClear.add(`${pt.r},${pt.c}`));
    if (g.cells.length >= 4) {
      const spot = focusPos && g.cells.some(p => p.r === focusPos.r && p.c === focusPos.c) ? focusPos : g.cells[1];
      const baseType = grid[spot.r][spot.c].type;
      specialsToSpawn.push({
        r: spot.r, c: spot.c, type: baseType,
        special: g.cells.length >= 5 ? 'bomb' : (g.dir === 'h' ? 'col' : 'row')
      });
    }
  }

  // Trigger existing specials inside toClear
  let expanded = true;
  while (expanded) {
    expanded = false;
    for (const key of Array.from(toClear)) {
      const [r, c] = key.split(',').map(Number);
      const cell = grid[r][c];
      if (!cell || !cell.special) continue;
      if (cell.special === 'row') {
        for (let k = 0; k < N; k++) if (!toClear.has(`${r},${k}`)) { toClear.add(`${r},${k}`); expanded = true; }
      } else if (cell.special === 'col') {
        for (let k = 0; k < N; k++) if (!toClear.has(`${k},${c}`)) { toClear.add(`${k},${c}`); expanded = true; }
      }
    }
  }

  if (combo >= 2) showCombo(combo === 2 ? 'رائع! ✨' : combo === 3 ? 'مذهل! 🔥' : 'أسطوري! 👑');
  sfx.match(combo);
  await clearCells(toClear, combo);

  for (const sp of specialsToSpawn) {
    grid[sp.r][sp.c] = { type: sp.type, special: sp.special, id: nextId++ };
  }
  renderGems();
}

async function clearCells(keySet, combo) {
  score += keySet.size * 15 * combo;
  updateHUD();
  for (const key of keySet) {
    const [r, c] = key.split(',').map(Number);
    const cell = grid[r][c];
    if (cell) {
      spawnBurst(r, c, COLORS[cell.type]);
      const el = document.getElementById('gem-' + cell.id);
      if (el) el.style.opacity = '0';
      grid[r][c] = null;
    }
  }
  await wait(190);
}

async function cascadeAndResolve(combo) {
  while (true) {
    // Drop down
    for (let c = 0; c < N; c++) {
      let writeR = N - 1;
      for (let r = N - 1; r >= 0; r--) {
        if (grid[r][c]) {
          grid[writeR][c] = grid[r][c];
          if (writeR !== r) grid[r][c] = null;
          writeR--;
        }
      }
      while (writeR >= 0) {
        grid[writeR][c] = { type: randType(), special: null, id: nextId++ };
        writeR--;
      }
    }
    renderGems();
    await wait(240);

    const nextGroups = findMatchGroups();
    if (!nextGroups.length) break;
    await resolveMatches(nextGroups, combo++);
  }
}

function showCombo(text) {
  const b = document.getElementById('comboText');
  b.textContent = text;
  b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 850);
}

function updateHUD() {
  document.getElementById('gScore').textContent = score;
  document.getElementById('gMoves').textContent = moves;
  document.getElementById('gGoal').textContent = goal;
  document.getElementById('gLevelLabel').textContent = 'المرحلة ' + level;
  document.getElementById('gRemainLabel').textContent = score >= goal ? 'تم تحقيق الهدف! ✨' : 'باقي ' + (goal - score);
  document.getElementById('gBar').style.width = Math.min(100, (score / goal) * 100) + '%';
}

function finishTurn() {
  busy = false;
  if (score >= goal) {
    sfx.win();
    const earned = score >= goal * 1.6 ? 3 : score >= goal * 1.25 ? 2 : 1;
    const prev = levelStars[level] || 0;
    if (earned > prev) {
      totalStars += (earned - prev);
      levelStars[level] = earned;
    }
    if (score > bestScore) bestScore = score;
    unlocked = Math.max(unlocked, Math.min(120, level + 1));
    saveProgress();

    openModal('🏆', 'انتصار أسطوري!', `حققتِ ${score} نقطة وحصلتِ على ${'⭐'.repeat(earned)}!`,
      level < 120 ? 'المرحلة التالية ▶' : 'العودة للخريطة',
      () => { closeModal(); if (level < 120) startLevel(level + 1); else openMap(); }
    );
  } else if (moves <= 0) {
    openModal('💫', 'انتهت الحركات!', `جمعتِ ${score} من أصل ${goal} نقطة. جربي مرة أخرى!`,
      'إعادة المحاولة ↻',
      () => { closeModal(); startLevel(level); }
    );
  }
}

function startLevel(lvl) {
  level = lvl;
  goal = 600 + (lvl - 1) * 160;
  moves = Math.max(18, 26 - Math.floor((lvl - 1) / 12));
  score = 0; shufflesLeft = 3; selected = null; busy = false;
  document.getElementById('shuffleBtn').textContent = `🔀 خلط (${shufflesLeft})`;
  updateHUD();
  showScreen('game');
  document.getElementById('gem-layer').innerHTML = '';
  initGrid();
}

function openMap() {
  const mg = document.getElementById('mapGrid');
  mg.innerHTML = '';
  for (let i = 1; i <= 120; i++) {
    const btn = document.createElement('button');
    const isLocked = i > unlocked;
    btn.className = 'lvl-node' + (isLocked ? ' locked' : '') + (i === unlocked ? ' current' : '');
    const st = levelStars[i] ? '⭐'.repeat(levelStars[i]) : (isLocked ? '🔒' : '☆☆☆');
    btn.innerHTML = `<span>${i}</span><div class="lvl-stars">${st}</div>`;
    if (!isLocked) btn.onclick = () => startLevel(i);
    mg.appendChild(btn);
  }
  showScreen('map');
}

function openModal(emoji, title, desc, btnText, action) {
  document.getElementById('modalEmoji').textContent = emoji;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalDesc').textContent = desc;
  const p = document.getElementById('modalPrimary');
  p.textContent = btnText; p.onclick = action;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function shareGame() {
  const text = `💎 وصلت للمرحلة ${unlocked} وجمعت ${totalStars} نجمة في لعبة AG Crystal Quest! تقدر تتحداني؟`;
  if (navigator.share) {
    try { await navigator.share({ title: 'AG Crystal Quest', text, url: location.href }); } catch(e) {}
  } else {
    navigator.clipboard?.writeText(text);
    alert('تم نسخ رسالة التحدي لمشاركتها مع أصحابك! 📋✨');
  }
}

// Button Bindings
document.getElementById('playBtn').onclick = () => startLevel(unlocked);
document.getElementById('mapOpenBtn').onclick = openMap;
document.getElementById('backHomeBtn').onclick = () => showScreen('home');
document.getElementById('toMapBtn').onclick = openMap;
document.getElementById('restartBtn').onclick = () => { if (!busy) startLevel(level); };
document.getElementById('shuffleBtn').onclick = () => {
  if (busy || shufflesLeft <= 0) return;
  shufflesLeft--;
  document.getElementById('shuffleBtn').textContent = `🔀 خلط (${shufflesLeft})`;
  sfx.special();
  document.getElementById('gem-layer').innerHTML = '';
  initGrid();
};
document.getElementById('soundBtn').onclick = (e) => {
  sfx.enabled = !sfx.enabled;
  e.target.textContent = sfx.enabled ? '🔊' : '🔇';
};
document.getElementById('shareBtn').onclick = shareGame;
document.getElementById('modalShare').onclick = shareGame;

loadProgress();
</script>
